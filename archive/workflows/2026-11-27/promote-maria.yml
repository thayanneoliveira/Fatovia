name: FatoVia | Promote approved Maria video without re-encoding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-maria.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fatovia-state
  cancel-in-progress: false
jobs:
  remux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install approved media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify uploaded source and copy AV packets to MP4
        run: python tools/promote_maria_upload.py
      - name: Verify resulting Pages MP4 matches approved A/V packets
        run: python tools/verify_reel_asset.py
      - name: Run repository regressions before committing
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Persist exact remux and provenance, no Instagram publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/reels/FatoVia_Maria_Reel_Revisado.mp4 data/multiformat_experiment.json
          git diff --cached --quiet && exit 0
          git commit -m "FatoVia: host stream-identical approved Maria MP4 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
