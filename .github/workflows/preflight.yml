name: "FatoVia | Preflight documental sem publicacao"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FatoVia | Hospedagem publica de imagens"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "fatovia/preflight.py"
      - "fatovia/review_pack.py"
      - "tests/test_review_pack.py"
      - ".github/workflows/preflight.yml"
permissions:
  contents: read
concurrency:
  group: fatovia-preflight
  cancel-in-progress: false
jobs:
  dryrun:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_review_pack.py -v
      - name: Executar verificacoes sem credenciais e sem POST
        run: python -m fatovia.preflight
      - name: Preparar pacote visual para revisao
        run: |
          python -m fatovia.review_pack
          git rev-parse HEAD > review-output/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-documental-sem-publicacao
          path: |
            data/preflight_report.json
            review-output/
          retention-days: 7
          if-no-files-found: error
