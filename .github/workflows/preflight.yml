name: "FatoVia | Preflight documental sem publicacao"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fatovia/preflight.py"
      - ".github/workflows/preflight.yml"
permissions:
  contents: write
concurrency:
  group: fatovia-preflight
  cancel-in-progress: false
jobs:
  dryrun:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m fatovia.preflight
      - name: Registrar resultado sem alterar fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preflight_report.json
          if ! git diff --cached --quiet; then
            git commit -m "FatoVia: preflight documental [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
