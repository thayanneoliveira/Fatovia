name: "FatoVia | MA arquivos brutos 2T"
on:
  push:
    paths:
      - ".github/workflows/ma-arquivos-brutos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler apenas indice remoto ZIP 4,25GB (limite de trafego)
        run: python -m auditoria.ma_arqurna_range
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-inventario-arquivos-brutos-ma
          path: work/aprofundada/ma_arqurna_index.json
          if-no-files-found: warn
          retention-days: 30
