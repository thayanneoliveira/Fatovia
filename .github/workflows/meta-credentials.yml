name: "FatoVia | Credenciais e insights Meta"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Diagnostico somente leitura ou renovacao do token"
        type: choice
        options:
          - diagnostico
          - validar_rotador
          - renovar
        default: diagnostico
        required: true
  schedule:
    - cron: "37 13 * * 1"
permissions:
  contents: read
concurrency:
  group: fatovia-meta-credential
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostico'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
    steps:
      - name: Testar credencial e insights sem alterar a conta
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.parse, urllib.error, json, re, sys
          token = os.getenv("META_ACCESS_TOKEN", "").strip()
          ig = os.getenv("META_IG_USER_ID", "").strip()
          if not token or not re.fullmatch(r"[0-9]{5,30}", ig):
              sys.exit("Credenciais definitivas incompletas")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def get(path, **params):
              url = "https://graph.instagram.com/v25.0/" + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with opener.open(req, timeout=20) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  try:
                      err = json.load(exc).get("error", {})
                      code = err.get("code")
                      sub = err.get("error_subcode")
                      print("HTTP", exc.code, "Meta code", code if isinstance(code,int) else "-", "subcode", sub if isinstance(sub,int) else "-")
                  except Exception:
                      print("HTTP", exc.code)
                  return None
              except Exception:
                  print("Falha de transporte ou resposta")
                  return None
          me = get("me", fields="user_id,username")
          if not me or str(me.get("user_id")) != ig or str(me.get("username","")).lower() != "fato.via":
              sys.exit("Identidade nao validada")
          print("IDENTIDADE: OK @fato.via")
          media = get(ig + "/media", fields="id,media_type,timestamp", limit=10)
          if not media or not isinstance(media.get("data"),list):
              sys.exit("Leitura de midias indisponivel")
          entries = [m for m in media["data"] if re.fullmatch(r"[0-9]{5,30}",str(m.get("id","")))]
          print("MIDIAS_RECENTES:", len(entries))
          if not entries:
              sys.exit("Sem midias para testar insights")
          supported = 0
          for metric in ("reach", "saved", "shares", "views"):
              data = get(str(entries[0]["id"]) + "/insights", metric=metric)
              if data and isinstance(data.get("data"),list) and data["data"]:
                  print("METRICA", metric, "DISPONIVEL")
                  supported += 1
              else:
                  print("METRICA", metric, "INDISPONIVEL OU SEM DADOS")
          if not supported:
              sys.exit("Nenhum insight confirmado; revisar permissoes no portal Meta")
          print("INSIGHTS: PARCIAL OU TOTALMENTE DISPONIVEIS", supported, "/4")
          print("EXPIRACAO: nao inferida do teste de leitura")
          PY
  rotation_preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validar_rotador' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.META_SECRET_ROTATOR }}
    steps:
      - name: Validar escrita com secret descartavel sem tocar nas credenciais Meta
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "META_SECRET_ROTATOR ausente"; exit 1; }
          test "${GITHUB_REPOSITORY,,}" = "thayanneoliveira/fatovia"
          name="FATOVIA_ROTATOR_PROBE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/actions/secrets/public-key" >/dev/null
          gh api "repos/$repo/actions/secrets/META_ACCESS_TOKEN" >/dev/null
          printf '%s' 'non-sensitive-test-value' | gh secret set "$name" --repo "$repo" >/dev/null
          trap 'gh secret delete "$name" --repo "$repo" >/dev/null 2>&1 || true' EXIT
          gh api "repos/$repo/actions/secrets/$name" >/dev/null
          gh secret delete "$name" --repo "$repo" >/dev/null
          trap - EXIT
          echo "ROTADOR_OK: escrita e exclusao de secret descartavel confirmadas."
          echo "Token Meta preservado; nenhuma publicacao realizada."
  rotate:
    if: ${{ vars.META_ROTATION_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'renovar') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      GH_TOKEN: ${{ secrets.META_SECRET_ROTATOR }}
    steps:
      - name: Renovar token e gravar somente em Actions Secrets
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.parse, urllib.error, json, re, sys, subprocess
          token = os.getenv("META_ACCESS_TOKEN","").strip()
          ig = os.getenv("META_IG_USER_ID","").strip()
          if not token or not re.fullmatch(r"[0-9]{5,30}",ig) or not os.getenv("GH_TOKEN"):
              sys.exit("Credenciais ou rotador ausentes; nenhuma renovacao feita")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          repo=os.environ["GITHUB_REPOSITORY"]
          if repo.lower() != "thayanneoliveira/fatovia" or os.environ.get("GITHUB_REF") != "refs/heads/main":
              sys.exit("Repositorio ou branch nao autorizada")
          def read(url, auth=None):
              headers={"Authorization":"Bearer "+auth} if auth else {}
              try:
                  with opener.open(urllib.request.Request(url,headers=headers),timeout=25) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP",e.code,"na consulta protegida")
                  return None
              except Exception:
                  return None
          def valid(t):
              m=read("https://graph.instagram.com/v25.0/me?fields=user_id,username",t)
              return bool(m and str(m.get("user_id"))==ig and str(m.get("username","")).lower()=="fato.via")
          if not valid(token):
              sys.exit("Token atual invalido ou conta divergente")
          # Verifica ao menos leitura da chave publica antes de renovar.
          test=subprocess.run(["gh","api","repos/"+repo+"/actions/secrets/public-key"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if test.returncode:
              sys.exit("Rotador sem acesso a chave publica dos secrets")
          url="https://graph.instagram.com/refresh_access_token?"+urllib.parse.urlencode({"grant_type":"ig_refresh_token","access_token":token})
          result=read(url)
          new=(result or {}).get("access_token")
          expiry=(result or {}).get("expires_in")
          if not isinstance(new,str) or not new or not isinstance(expiry,int) or expiry <= 86400 or not re.fullmatch(r"[A-Za-z0-9._~-]+",new):
              sys.exit("Renovacao nao confirmada; verificar idade, validade e tipo do token")
          print("::add-mask::"+new,flush=True)
          if not valid(new):
              sys.exit("Novo token nao validado; nao persistido")
          saved=subprocess.run(["gh","secret","set","META_ACCESS_TOKEN","--repo",repo],input=new,text=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if saved.returncode:
              sys.exit("Meta renovou mas GitHub nao confirmou armazenamento; requer intervencao")
          print("RENOVACAO_CONFIRMADA: secret atualizado")
          print("VALIDADE_INFORMADA_EM_DIAS:",round(expiry/86400,1))
          PY
