name: "FatoVia | Testes auditoria"

on:
  push:
    paths:
      - "auditoria/**"
      - "tests/test_auditoria.py"
      - ".github/workflows/auditoria-testes.yml"
  pull_request:
    paths:
      - "auditoria/**"
      - "tests/test_auditoria.py"
      - ".github/workflows/auditoria-testes.yml"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes automatizados offline
        run: python -m unittest discover -s tests -p 'test_auditoria.py' -v
