name: FatoVia auditoria v2 - reconciliacao nacional 28 unidades
on:
  push:
    branches: [auditoria-forense-v2-2026]
    paths:
      - ".github/workflows/auditoria-v2-nacional.yml"
  workflow_dispatch:
jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lote: lote-1
            unidades: "AC AL AM AP BA CE DF"
          - lote: lote-2
            unidades: "ES GO MA MG MS MT PA"
          - lote: lote-3
            unidades: "PB PE PI PR RJ RN RO"
          - lote: lote-4
            unidades: "RR RS SC SE SP TO ZZ"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar arquivos e hashes oficiais
        run: |
          python auditoria-v2/baixar_fontes.py --out fontes-auditoria-v2 --ufs ${{ matrix.unidades }}
      - name: Reconciliar TODAS as seções nas quatro fontes
        run: |
          python auditoria-v2/reconciliar_secoes.py --input-dir fontes-auditoria-v2 --output-dir resultados-auditoria-v2 --ufs ${{ matrix.unidades }}
      - name: Guardar matriz e manifesto do lote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatovia-v2-shard-${{ matrix.lote }}
          path: resultados-auditoria-v2/
          if-no-files-found: warn
          retention-days: 30
  consolidar:
    needs: [shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fatovia-v2-shard-*
          path: resultados-parciais-v2
          merge-multiple: false
      - name: Validar 28 unidades, SHAs e totais reproduzidos
        run: |
          python auditoria-v2/consolidar_nacional.py --input-dir resultados-parciais-v2 --output-dir resultados-consolidados-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-v2-nacional-resultado
          path: resultados-consolidados-v2/
          if-no-files-found: warn
          retention-days: 30
