name: "FatoVia | Fila V6 apos hospedagem"
on:
  workflow_run:
    workflows: ["FatoVia | Hospedagem publica de imagens"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fatovia-state
  cancel-in-progress: false
jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m fatovia.release_escala_v6 queue
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/multiformat_experiment.json
          if ! git diff --cached --quiet; then
            git commit -m "Queue exact reviewed V6 Reel after public HTTP verification"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
