name: "FatoVia | Radar documental seguro"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial.yml"
      - "fatovia/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    - cron: "17 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: fatovia-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar motor editorial
        run: python -m unittest discover -s tests -v
      - name: Atualizar metricas opcionais
        if: vars.METRICS_ENABLED == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v25.0
        run: python -m fatovia metrics
      - name: Gerar JPEG de verificacao tecnica (nao publicar)
        run: python -m fatovia.healthcheck
      - name: Consultar fonte oficial e preparar cards (sem publicar)
        run: python -m fatovia scan
      - name: Preservar memoria, imagens e relatorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if ! git diff --cached --quiet; then
            git commit -m "FatoVia: atualizar memoria e pautas [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
