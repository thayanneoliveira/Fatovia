name: "FatoVia | Radar documental seguro"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial.yml"
      - "fatovia/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    - cron: "17 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: fatovia-state
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar motor editorial
        run: python -m unittest discover -s tests -v
      - name: Atualizar metricas opcionais
        if: vars.METRICS_ENABLED == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v25.0
        run: python -m fatovia metrics
      - name: Gerar JPEG de verificacao tecnica (nao publicar)
        run: python -m fatovia.healthcheck
      - name: Consultar fonte oficial e preparar cards (sem publicar)
        run: python -m fatovia scan
      - name: Persistir dados com reconciliacao de concorrencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$attempt" -gt 1 ]; then
              git reset --hard origin/main
              python -m fatovia.healthcheck
              python -m fatovia scan
            fi
            git add -A data docs
            if git diff --cached --quiet; then
              echo "Sem alteracoes de memoria"
              exit 0
            fi
            git commit -m "FatoVia: atualizar memoria e pautas [skip ci]"
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Memoria persistida com sucesso"
              exit 0
            fi
            git rebase --abort || true
            echo "Conflito detectado: reconciliando com a ultima versao do repositorio"
          done
          echo "::error::Nao foi possivel persistir o estado sem sobrescrever trabalho remoto"
          exit 1
