name: FatoVia | V6 factory isolated
on:
  push:
    branches: ['feature/v6-reel-factory-20261127', 'fix/reel-factory-recovery-20261127', main]
    paths: ['.github/workflows/reel-factory.yml', 'fatovia/reel_factory.py', 'fatovia/reel_render.py', 'fatovia/reel_release.py']
  schedule:
    - cron: '5 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fatovia-reel-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q fatovia
      - run: python -m unittest discover -s tests -v
  draft:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m fatovia.reel_factory --out reel-draft
      - name: Reportar elegibilidade e custo sem expor credenciais
        env:
          FREE_VERIFIED: ${{ vars.FATOVIA_GEMINI_FREE_TIER_VERIFIED }}
          API_KEY: ${{ secrets.FATOVIA_GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          print(json.dumps({"reviewed_plan":Path("reel-draft/plan.json").is_file(),"free_tier_verified":os.getenv("FREE_VERIFIED")=="true","api_key_configured":bool(os.getenv("API_KEY")),"publish_allowed":False}))
          PY
      - name: Restore audio cache
        if: hashFiles('reel-draft/script.txt') != ''
        uses: actions/cache@v4
        with:
          path: reel-audio-cache
          key: v6-algenib-${{ hashFiles('reel-draft/script.txt') }}
      - name: Render only when free-tier attestation is configured
        if: hashFiles('reel-draft/plan.json') != '' && vars.FATOVIA_GEMINI_FREE_TIER_VERIFIED == 'true'
        env:
          FATOVIA_GEMINI_FREE_TIER_VERIFIED: ${{ vars.FATOVIA_GEMINI_FREE_TIER_VERIFIED }}
          FATOVIA_GEMINI_API_KEY: ${{ secrets.FATOVIA_GEMINI_API_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato
          python -m pip install numpy faster-whisper
          python -m fatovia.reel_render --out reel-draft --cache reel-audio-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-v6-draft
          path: reel-draft/
          if-no-files-found: ignore
          retention-days: 7
