name: FatoVia | Multiformat migration tests
on:
  push:
    branches: ['feature/civic-premium-autonomy-20261128', 'feature/carousel-premium-20261128', 'fix/reel-release-bridge-20261127', 'fix/autonomy-chain-20261127', 'feature/multiformat-publication', 'fix/pilot-transition-20261119', 'feature/multiformat-incident-closure-20261121', 'feature/v6-algenib-publisher-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q fatovia
      - run: python -m unittest discover -s tests -v
      - name: Renderizar prévias premium com marca aprovada
        if: github.ref == 'refs/heads/feature/carousel-premium-20261128'
        run: python -m fatovia.premium_preview
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feature/carousel-premium-20261128'
        with:
          name: fatovia-premium-49-cards
          path: premium-preview/
          retention-days: 3
      - name: Validar fontes cívicas reais sem publicar
        if: github.ref == 'refs/heads/feature/civic-premium-autonomy-20261128'
        run: python -m fatovia.civic_smoke
