name: Gerar carrossel FatoVia - Promessas e realidade
on:
  push:
    branches: [auditoria-tse-2026]
    paths:
      - "fatovia-instagram/gerar_promessas_e_entregas.py"
      - ".github/workflows/gerar-promessas-2026.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-tse-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow e fonte editorial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato fonts-dejavu-core
          python -m pip install Pillow
      - name: Gerar 7 imagens JPEG
        run: python fatovia-instagram/gerar_promessas_e_entregas.py
      - name: Registrar URLs publicas dos cards sem modificar o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatovia-instagram/promessas_e_entregas_2026/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Hospedar cards FatoVia sobre promessas e competencias"
            git push origin HEAD:auditoria-tse-2026
          fi
