name: "FatoVia | Piloto urnas cidades 2026"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/geografia-piloto-2026.yml"
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        uf: [AP, MA, ZZ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir campo de municipio e vinculo com urna CEFT
        run: python -u -m auditoria.geografia_urnas_2026 --uf ${{ matrix.uf }} --out work/geografia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-geografia-piloto-${{ matrix.uf }}
          path: work/geografia/
          if-no-files-found: warn
          retention-days: 30
