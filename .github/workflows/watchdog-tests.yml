name: FatoVia | Watchdog tests
on:
  push:
    branches: [main, fix/autonomy-chain-20261127]
    paths: ["watchdog/**", ".github/workflows/watchdog-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test watchdog/test.mjs
