name: FatoVia | Recover current profile image (read only)
on:
  push:
    branches: ['lab/brand-recovery']
    paths: ['.github/workflows/brand-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_API_HOST: ${{ vars.META_API_HOST }}
      META_GRAPH_VERSION: v25.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read authorized Instagram avatar, no POST
        run: |
          python - <<'PY'
          from fatovia.publisher import config,MetaClient
          import requests,hashlib,json
          from pathlib import Path
          from urllib.parse import urlparse
          from io import BytesIO
          from PIL import Image
          c=config(); client=MetaClient(c);client.account()
          endpoint="me" if c["base"].startswith("https://graph.instagram.com/") else c["ig_id"]
          profile=client.request("GET",endpoint,params={"fields":"username,profile_picture_url"})
          if profile.get("username","").casefold()!="fato.via":raise SystemExit("account mismatch")
          url=profile.get("profile_picture_url",""); u=urlparse(url); host=u.hostname or ""
          if u.scheme!="https" or not host.endswith((".cdninstagram.com",".fbcdn.net")):raise SystemExit("unrecognized CDN")
          data=bytearray()
          # No Graph authorization header or token sent to CDN; no redirects.
          with requests.get(url,stream=True,timeout=(8,20),allow_redirects=False) as r:
              if r.status_code!=200:raise SystemExit("avatar unavailable")
              for chunk in r.iter_content(65536):
                  data.extend(chunk)
                  if len(data)>5_000_000:raise SystemExit("avatar too large")
          dest=Path("brand_candidate");dest.mkdir(exist_ok=True)
          with Image.open(BytesIO(data)) as im:
              if max(im.size)>4096:raise SystemExit("invalid image dimensions")
              im.convert("RGBA").save(dest/"profile_candidate.png")
          blob=(dest/"profile_candidate.png").read_bytes()
          (dest/"origin.json").write_text(json.dumps({"account":"fato.via","source":"current Instagram avatar","status":"candidate_requires_confirmation","sha256":hashlib.sha256(blob).hexdigest()},indent=2))
          print("Profile image recovered; not promoted or approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fatovia-profile-brand-candidate
          path: brand_candidate/
          retention-days: 3
          if-no-files-found: error
