name: "FatoVia | Piloto comparacao turnos 2026 MA AP"
on:
  push:
    paths:
      - ".github/workflows/comparar-turnos-piloto-2026.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        uf: [MA, AP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fatovia-geografia-uf-${{ matrix.uf }}
          run-id: 40877055121
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/geografia2t
      - name: Confrontar dois turnos e hashes
        run: python -u -m auditoria.comparar_turnos_2026 --uf ${{ matrix.uf }} --baseline-2t work/geografia2t --out work/comparacao-turnos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-turnos-piloto-${{ matrix.uf }}
          path: work/comparacao-turnos
          if-no-files-found: warn
          retention-days: 30
