name: "FatoVia | MA cruzamento RDV CEFT e logs"
on:
  push:
    paths:
      - ".github/workflows/ma-amostra-profunda.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar interpretador ASN.1
        run: python -m pip install 'asn1tools==0.167.0'
      - name: Auditar tres secoes foco e tres controles, sem baixar ZIP de 4,25GB
        run: python -m auditoria.ma_amostra_profunda
      - name: Gerar documento técnico com ressalvas
        run: python -m auditoria.relatorio_ma
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-ma-amostra-rdv-vsc-logs
          path: work/aprofundada/ma_*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publicar relatório e dados agregados no repositório
        run: |
          mkdir -p docs/auditoria
          cp work/aprofundada/ma_amostra_profunda.json docs/auditoria/ma-aprofundada-2026-2t.json
          cp work/aprofundada/ma_relatorio.md docs/auditoria/ma-aprofundada-2026-2t.md
          git config user.name "fatovia-audita[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditoria/ma-aprofundada-2026-2t.*
          if ! git diff --cached --quiet; then
            git commit -m "docs(auditoria): relatório público técnico MA segundo turno [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
