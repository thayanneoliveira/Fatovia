name: "FatoVia | MA assinatura BER e hashes SHA512"
on:
  push:
    paths:
      - ".github/workflows/ma-amostra-profunda.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar interpretador ASN.1
        run: python -m pip install 'asn1tools==0.167.0'
      - name: Auditar tres secoes foco e tres controles, sem baixar ZIP de 4,25GB
        run: python -m auditoria.ma_amostra_profunda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-ma-amostra-rdv-vsc-logs
          path: work/aprofundada/ma_amostra_profunda.json
          if-no-files-found: warn
          retention-days: 90
