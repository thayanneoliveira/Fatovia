name: FatoVia - auditoria cruzada 2026 | AC
on:
  push:
    branches: [auditoria-forense-v2-2026]
    paths:
      - ".github/workflows/auditoria-v2-coerencia-ac.yml"
      - "auditoria-v2/auditar_coerencia_2026.py"
  workflow_dispatch:
jobs:
  testes-sinteticos:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Testes de regressão (sem dados pessoais)
        run: |
          python -m py_compile auditoria-v2/auditar_coerencia_2026.py
          python -m unittest discover -s auditoria-v2/tests -p 'test_coerencia.py' -v
  piloto-acre:
    needs: [testes-sinteticos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Adquirir e confrontar 4 fontes oficiais do segundo turno e primeiro turno
        run: |
          python auditoria-v2/auditar_coerencia_2026.py --uf AC --data-dir fontes-auditoria --output-dir resultado-coerencia-AC
      - name: Preservar manifesto, cobertura e exceções
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatovia-coerencia-2026-ac
          path: resultado-coerencia-AC/
          if-no-files-found: warn
          retention-days: 30
