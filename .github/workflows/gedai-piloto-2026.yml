name: "FatoVia | Gedai fontes e formato piloto 2026"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gedai-piloto-2026.yml"
permissions:
  contents: read
jobs:
  inventario:
    name: "Gedai ${{ matrix.uf }} ${{ matrix.dia }} out"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        uf: [MA, BA, SP]
        dia: ["24", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventariar arquivo assinado pelo hash publicado do TSE
        run: python -u -m auditoria.gedai_inventario_2026 --uf ${{ matrix.uf }} --dia ${{ matrix.dia }} --out work/gedai
      - name: Preservar resultado independentemente do status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-gedai-piloto-${{ matrix.uf }}-${{ matrix.dia }}
          path: work/gedai
          if-no-files-found: warn
          retention-days: 90
