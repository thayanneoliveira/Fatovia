name: Voice Lab V2 - Santa
on:
  push:
    branches: ['lab/voice-kokoro']
    paths: ['.github/workflows/voice-lab.yml', 'voice_engine.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU synthesizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg libsndfile1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install kokoro==0.9.4 soundfile numpy
      - name: Generate and validate Santa profiles
        run: python voice_engine.py
      - name: Save samples
        uses: actions/upload-artifact@v4
        with:
          name: fatovia-santa-v2
          path: samples/
          retention-days: 3
          if-no-files-found: error
