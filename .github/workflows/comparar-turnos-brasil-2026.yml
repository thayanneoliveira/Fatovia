name: "FatoVia | Comparacao nacional primeiro segundo turno 2026"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/comparar-turnos-brasil-2026.yml"
permissions:
  actions: read
  contents: write
concurrency:
  group: fatovia-comparar-turnos-brasil-2026
  cancel-in-progress: false

jobs:
  comparar-uf:
    name: "Turnos ${{ matrix.uf }}"
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, ZZ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar o snapshot imutável da seção de 2º turno
        uses: actions/download-artifact@v4
        with:
          name: fatovia-geografia-uf-${{ matrix.uf }}
          run-id: 40877055121
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/geografia2t
      - name: Comparar 1º 2º turno e registrar os hashes oficiais
        run: python -u -m auditoria.comparar_turnos_2026 --uf ${{ matrix.uf }} --baseline-2t work/geografia2t --out work/turnos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-turnos-${{ matrix.uf }}
          path: work/turnos
          if-no-files-found: warn
          retention-days: 90

  consolidar:
    needs: comparar-uf
    if: always()
    name: "Resumo nacional e testes de variabilidade municipal"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fatovia-turnos-*
          path: work/turnos
          merge-multiple: true
        continue-on-error: true
      - name: Executar estatística descritiva com seções pareadas
        run: python -u -m auditoria.consolidar_turnos_2026 --input work/turnos --out work/turnos-consolidado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-turnos-consolidado
          path: work/turnos-consolidado
          if-no-files-found: warn
          retention-days: 90
      - name: Publicar relatório consolidado sem sobrescrever evidências anteriores
        if: success()
        run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/auditoria/comparacao-turnos-2026/ufs
          cp work/turnos/*.json docs/auditoria/comparacao-turnos-2026/ufs/
          cp work/turnos-consolidado/* docs/auditoria/comparacao-turnos-2026/
          git config user.name "fatovia-audita[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditoria/comparacao-turnos-2026
          if ! git diff --cached --quiet; then
            git commit -m "docs(auditoria): comparacao 1 e 2 turnos com hashes e cobertura [skip ci]"
            git push origin HEAD:main
          fi
