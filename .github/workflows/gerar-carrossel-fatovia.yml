name: Gerar cards FatoVia (auditoria 2026)
on:
  push:
    branches: [auditoria-tse-2026]
    paths:
      - "fatovia-instagram/gerar_carrossel.py"
      - ".github/workflows/gerar-carrossel-fatovia.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-tse-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar fontes e Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato
          python -m pip install Pillow
      - name: Renderizar sete imagens JPEG
        run: python fatovia-instagram/gerar_carrossel.py
      - name: Publicar imagens no ramo de auditoria, sem alterar o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatovia-instagram/cards/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar sete cards JPG do carrossel"
            git push origin HEAD:auditoria-tse-2026
          fi
