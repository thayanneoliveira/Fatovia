name: Auditoria independente de logs GEDAI 2026

on:
  push:
    branches: [auditoria-tse-2026]
    paths:
      - "auditoria-tse-2026/**"
      - ".github/workflows/auditoria-tse-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar-comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Carregar ramo isolado
        uses: actions/checkout@v4
        with:
          ref: auditoria-tse-2026
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar arquivos do TSE e comparar GEDAI MG e PE
        run: python auditoria-tse-2026/auditar_gedai.py
      - name: Instalar extrator 7z para pacotes JEZ do TSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
      - name: Ler eventos dos arquivos JEZ alterados
        run: python auditoria-tse-2026/auditar_eventos_jez.py
      - name: Salvar evidencias de resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-tse-2026-gedai
          path: |
            auditoria-resultados/RESULTADO_GEDAI.json
            auditoria-resultados/RESULTADO_GEDAI.md
            auditoria-resultados/RESULTADO_EVENTOS.json
            auditoria-resultados/RESULTADO_EVENTOS.md
          if-no-files-found: warn
      - name: Registrar relatorio no ramo de auditoria
        if: always()
        run: |
          if [ -f auditoria-resultados/RESULTADO_GEDAI.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add auditoria-resultados/RESULTADO_GEDAI.json auditoria-resultados/RESULTADO_GEDAI.md
            git add auditoria-resultados/RESULTADO_EVENTOS.json auditoria-resultados/RESULTADO_EVENTOS.md 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Registrar auditoria GEDAI com proveniencia e hashes"
              git push origin HEAD:auditoria-tse-2026
            fi
          fi
