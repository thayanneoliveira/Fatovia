name: "FatoVia | Detectar atualizacoes nos arquivos TSE 2026"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/conferir-versoes-tse-2026.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: fatovia-versoes-tse-2026
  cancel-in-progress: false

jobs:
  comparar-uf:
    name: "Comparar ${{ matrix.uf }} com snapshot 28-10"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, ZZ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar baseline efetivamente registrado no dia 28/10
        uses: actions/download-artifact@v4
        with:
          name: audit-br-uf-${{ matrix.uf }}
          path: work/baseline
          run-id: 40710628106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Comparar arquivos atuais com o snapshot
        run: |
          python -u -m auditoria.comparar_versoes_tse_2026 \
            --uf ${{ matrix.uf }} \
            --original work/baseline/${{ matrix.uf }}.json \
            --bu-historico docs/auditoria/2026-2t-presidente.json \
            --raw-max ${{ matrix.uf == 'MA' && '5000000000' || (matrix.uf == 'RR' || matrix.uf == 'ZZ') && '400000000' || '0' }} \
            --out work/versoes/${{ matrix.uf }}.json
      - name: Guardar verificacao e erros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatovia-versoes-${{ matrix.uf }}
          path: work/versoes/${{ matrix.uf }}.json
          if-no-files-found: warn
          retention-days: 90

  consolidar:
    needs: comparar-uf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fatovia-versoes-*
          path: work/versoes
          merge-multiple: true
        continue-on-error: true
      - name: Gerar sumario de todos os 28 estados e exterior
        run: python -u -m auditoria.consolidar_versoes_tse_2026 --in-dir work/versoes --out-dir work/versoes-consolidado
      - uses: actions/upload-artifact@v4
        with:
          name: fatovia-conferencia-de-versoes-nacional
          path: work/versoes-consolidado/*
          retention-days: 90
      - name: Versionar sem apagar evidencias anteriores
        run: |
          mkdir -p docs/auditoria/versoes-tse-2026/ufs
          cp work/versoes/*.json docs/auditoria/versoes-tse-2026/ufs/ 2>/dev/null || true
          cp work/versoes-consolidado/comparacao-versoes-2026-2t.* docs/auditoria/versoes-tse-2026/
          git config user.name "fatovia-audita[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditoria/versoes-tse-2026
          if ! git diff --cached --quiet; then
            git commit -m "docs(auditoria): comparacao de arquivos TSE com baseline de 28-10 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
