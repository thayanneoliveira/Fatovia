name: "FatoVia | Hospedagem publica de imagens"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["FatoVia | Radar documental seguro"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "fatovia-pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do ultimo commit disponivel
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar FFmpeg somente quando ha Reel MP4
        if: ${{ hashFiles('docs/media/reels/FatoVia_Maria_Reel_Revisado.mp4') != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verificar se Pages esta habilitado
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Informar ativacao manual pendente
        if: steps.pages_setup.outcome != 'success'
        run: echo '::warning::Ative GitHub Pages em Settings > Pages > Source > GitHub Actions.'
      - name: Impedir hospedagem de Reel diferente do aprovado
        run: python tools/verify_reel_asset.py
      - name: Enviar apenas conteudo publico (docs)
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Aguardar indexacao do artefato do Pages
        if: steps.pages_setup.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -Eq '^[0-9]+
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Validar MP4 publico contra hash da versao aprovada
        if: steps.pages_setup.outcome == 'success'
        run: python tools/verify_reel_public.py
; then
              echo "Pages artifact visible in API"
              break
            fi
            if [ "$attempt" -eq 10 ]; then echo "Pages artifact missing"; exit 1; fi
            sleep 5
          done
      - name: Publicar site e JPEGs
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Validar MP4 publico contra hash da versao aprovada
        if: steps.pages_setup.outcome == 'success'
        run: python tools/verify_reel_public.py
