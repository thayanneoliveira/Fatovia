name: "FatoVia | Proveniência MA - qualificar divergências"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/proveniencia-ma.yml"

permissions:
  contents: read

jobs:
  proveniencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir hashes e estruturas CESP-24, CESP-25 e CEFT-26
        run: python -m auditoria.proveniencia_ma
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fatovia-ma-proveniencia
          path: work/proveniencia/*.json
          if-no-files-found: warn
          retention-days: 30
