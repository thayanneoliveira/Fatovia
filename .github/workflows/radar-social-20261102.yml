name: "FatoVia | Radar social 02 Nov 2026 - gerar cards"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-social-20261102.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fatovia-radar-social-20261102
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar identidade visual e demais testes
        run: python -m unittest discover -s tests -v
      - name: Gerar 21 JPEGs com paleta validada
        run: python -m scripts.build_radar_social_20261102
      - name: Persistir assets públicos sem mudar outros arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/radar-social-2026-11-02
          if git diff --cached --quiet; then
            echo "Assets já existem"
            exit 0
          fi
          git commit -m "FatoVia: imagens editoriais do radar social [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
