name: Gerar post unico sobre auditoria nacional
on:
  push:
    branches: [auditoria-tse-2026]
    paths:
      - "fatovia-instagram/gerar_publicacao_unica.py"
      - ".github/workflows/gerar-publicacao-unica-fatovia.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  carrossel-unico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-tse-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar fontes e biblioteca
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato
          pip install Pillow
      - name: Gerar sete JPEGs
        run: python fatovia-instagram/gerar_publicacao_unica.py
      - name: Hospedar JPEGs publicamente no ramo isolado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fatovia-instagram/publicacao_unica_2026/card_*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Renderizar carrossel unico do FatoVia"
            git push origin HEAD:auditoria-tse-2026
          fi
