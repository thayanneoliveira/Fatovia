name: FatoVia | Escala 5x2 V6 Algenib (laboratorio)
on:
  push:
    branches: ['lab/escala-5x2-v5-algenib-20261127']
    paths: ['.github/workflows/escala-5x2-lab.yml']
permissions:
  contents: read
  actions: read
jobs:
  reel:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato
          python -m pip install pillow numpy faster-whisper
          python -m unittest discover -s tests -p test_narration.py -v
      - name: Recover original Algenib audio without another API request
        uses: actions/download-artifact@v4
        with:
          name: escala-5x2-v5-algenib-lab
          run-id: '46038999686'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/algenib
      - name: Verify recovered WAV against original seal
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'algenib'
          wavs=list(root.rglob('*.wav'))
          assert len(wavs)==1
          wav=wavs[0]
          seal=json.loads(wav.with_suffix('.json').read_text())
          assert seal['voice']=='Algenib'
          assert hashlib.sha256(wav.read_bytes()).hexdigest()==seal['sha256']
          print('Verified Algenib duration:',seal['duration_seconds'])
          PY
      - name: Render V6 and validate integrated MP4 audio
        run: |
          set -euo pipefail
          audio="$(find "$RUNNER_TEMP/algenib" -name '*.wav' -print -quit)"
          test -n "$audio"
          python tools/render_escala_5x2_lab.py "$audio" reel-lab-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escala-5x2-v6-algenib-lab
          path: |
            reel-lab-output/
            ${{ runner.temp }}/algenib/
          if-no-files-found: warn
          retention-days: 7
