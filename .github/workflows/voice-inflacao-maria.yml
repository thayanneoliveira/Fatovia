name: Voice Lab - Santa R story factory
on:
  push:
    branches: ['lab/voice-kokoro']
    paths: ['.github/workflows/voice-inflacao-maria.yml']
  workflow_dispatch:
    inputs:
      story:
        description: Narrativa de laboratorio
        required: true
        default: obras
        type: choice
        options:
          - obras
          - maria
permissions:
  contents: read
jobs:
  santa-r:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice and acoustic engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg libsndfile1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install kokoro==0.9.4 numpy==1.26.4 soundfile==0.13.1 pyworld==0.3.5
      - name: Generate validated Santa R voice with exact lab script
        env:
          STORY: ${{ inputs.story || 'obras' }}
        run: |
          if [ "$STORY" = obras ]; then script=obras_roteiro.json; elif [ "$STORY" = maria ]; then script=inflacao_maria_roteiro.json; else exit 1; fi
          echo "Script: $script"
          python voice_santa_r.py --input "$script" --out santa_factory_audio
          cp "$script" santa_factory_audio/script.json
      - name: Install independent speech auditor
        run: python -m pip install faster-whisper==1.2.1
      - name: Run independent word-timing audit
        run: |
          python speech_audit.py --audio santa_factory_audio/R_episodio.mp3 --script santa_factory_audio/script.json --manifest santa_factory_audio/R_episodio.json --out santa_factory_audio/asr --model small
      - name: Upload diagnostics and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatovia-factory-santa-r
          path: santa_factory_audio/
          retention-days: 3
          if-no-files-found: warn
