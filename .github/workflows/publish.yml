name: "FatoVia | Publicacao Instagram controlada"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "fatovia/publisher.py"
      - "tests/test_publisher.py"
  schedule:
    - cron: "12 11-23,0-1 * * *"

permissions:
  contents: write

concurrency:
  group: fatovia-state
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Conferir estado sem publicar
        run: python -m fatovia.publisher status
      - name: Verificar JPEG publico por HTTP
        run: python -m fatovia.publisher probe

  publish:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.IG_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IG_PUBLISH_ENABLED: ${{ vars.IG_PUBLISH_ENABLED }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_API_HOST: ${{ vars.META_API_HOST }}
      META_GRAPH_VERSION: v25.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar regras antes de qualquer POST
        run: python -m unittest discover -s tests -v
      - name: Escolher pauta e preparar checkpoint
        id: prep
        shell: bash
        run: |
          python -m fatovia.publisher prepare > /tmp/fatovia_prepare.json
          cat /tmp/fatovia_prepare.json
          echo "action=$(python -c 'import json;print(json.load(open("/tmp/fatovia_prepare.json"))["action"])')" >> "$GITHUB_OUTPUT"
      - name: Persistir checkpoint antes de enviar para Meta
        if: steps.prep.outputs.action == 'prepared'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "::error::Checkpoint nao gravado; envio bloqueado"
            exit 1
          fi
          git commit -m "FatoVia: reservar pauta para publicar [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Entregar carrossel na conta validada
        if: steps.prep.outputs.action == 'prepared'
        run: python -m fatovia.publisher deliver
      - name: Conciliar transacao anterior sem novo POST
        if: steps.prep.outputs.action == 'reconcile'
        run: python -m fatovia.publisher reconcile
      - name: Persistir resultado, inclusive erro ambiguo
        if: ${{ always() && (steps.prep.outputs.action == 'prepared' || steps.prep.outputs.action == 'reconcile') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "FatoVia: registrar resultado da transacao [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
