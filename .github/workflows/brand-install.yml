name: FatoVia | Install confirmed circular identity
on:
  push:
    branches: ['lab/brand-recovery']
    paths: ['.github/workflows/brand-install.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fatovia-state
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: fatovia-profile-brand-candidate
          run-id: 44193381131
          github-token: ${{ github.token }}
          path: /tmp/confirmed-brand
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install exact confirmed avatar with transparent corners
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          src=Path('/tmp/confirmed-brand/profile_candidate.png')
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='89b88cb9182576dc3336964295baaf322985d9bc43be61cc2425b8f3e082ca56'
          logo=Image.open(src).convert('RGBA');assert logo.size==(240,240)
          mask=Image.new('L',(960,960));ImageDraw.Draw(mask).ellipse((15,15,945,945),fill=255)
          logo.putalpha(mask.resize(logo.size,Image.Resampling.LANCZOS))
          target=Path('assets/fatovia-approved.png');target.parent.mkdir(exist_ok=True);logo.save(target)
          h=hashlib.sha256(target.read_bytes()).hexdigest()
          p=Path('data/multiformat_experiment.json'); d=json.loads(p.read_text())
          assert d['status']=='prepared_guarded' and d['daily_caps']=={'carousel':4,'reel':1} and d['max_spend_brl']==0
          d['approved_logo']={'path':str(target),'sha256':h,'source':'owner-confirmed @fato.via avatar; transparent exterior mask only','source_sha256':'89b88cb9182576dc3336964295baaf322985d9bc43be61cc2425b8f3e082ca56','size':[240,240],'confirmed_date':'2026-11-17'}
          d['deployment_blockers']=['Reel: exact high-resolution approved endcard, final MP4 transfer, public hosting, independent source/audio/visual review and real Meta delivery still pending.','Autonomous V5 rendering of unrelated topics not validated.']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          from fatovia.brand import approved_logo
          assert approved_logo() is not None
          print('Confirmed logo SHA256:',h)
          PY
      - run: python -m unittest discover -s tests -v
      - name: Commit approved brand only (no direct Meta post)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fatovia-approved.png data/multiformat_experiment.json
          git diff --cached --quiet && exit 0
          git commit -m "FatoVia: install owner-confirmed transparent circular identity [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
