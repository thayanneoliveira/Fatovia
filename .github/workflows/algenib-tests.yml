name: FatoVia | Algenib isolated tests
on:
  push:
    branches: ['feature/algenib-tts-20261126']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q fatovia
      - run: python -m unittest discover -s tests -v
