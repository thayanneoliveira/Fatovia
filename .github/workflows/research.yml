name: "FatoVia | Investigacao economica documental"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research.yml"
      - "fatovia/research.py"
      - "tests/test_research.py"
      - "fatovia/budget.py"
      - "tests/test_budget.py"
  schedule:
    - cron: "25 13 * * *"
permissions:
  contents: write
concurrency:
  group: fatovia-economic-context
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_research.py -v
      - run: python -m unittest discover -s tests -p test_budget.py -v
      - name: Coletar indicadores publicos sem credenciais Meta
        run: python -m fatovia.research
      - name: Coletar RREO Uniao sem credenciais Meta
        run: python -m fatovia.budget
      - name: Persistir apenas contexto economico e orcamentario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic_context.json data/budget_context.json
          if ! git diff --cached --quiet; then
            git commit -m "FatoVia: registrar contexto economico [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
